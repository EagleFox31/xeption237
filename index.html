<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505">

  <!-- Performance Optimization -->
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="NWUvZVr4uUF0RRFyxZlKZJaMfC8t3qLk_UvLfJtBfIU" />

  <!-- SEO & Categorization -->
  <title>Xeption | Leader High-Tech & Troc au Cameroun</title>

  <meta name="author" content="Xeption" />
  <meta name="robots" content="index, follow" />

  <!--
    SEO par page (description, canonical, Open Graph, Twitter) = géré dynamiquement
    par utils/seo.tsx (react-helmet-async) et capturé au prerender (scripts/prerender.mjs).
    NE PAS remettre ici de balises description / canonical / og:* / twitter:* statiques :
    Helmet AJOUTE les siennes sans supprimer celles-ci → doublons sur les pages prerendues.
    Conséquences observées : canonical produit + canonical accueil (risque de non-indexation),
    et aperçu de partage affichant le LOGO au lieu de la photo produit (1re balise gagne).
    Seul twitter:site reste ici (non géré par Helmet).
  -->
  <meta property="twitter:site" content="@xeption237" />

  <!-- Favicon - Correction complète pour Google (48px multiples) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="shortcut icon" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Structured Data (JSON-LD) - Double déclaration Store + Organization pour le Logo -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.xeptionetwork.shop/#organization",
          "name": "Xeption Network",
          "url": "https://www.xeptionetwork.shop",
          "logo": {
            "@type": "ImageObject",
            "url": "https://res.cloudinary.com/dli0kdkg9/image/upload/v1768287078/logo_mbajfa.png",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://www.facebook.com/xeptioon/",
            "https://www.instagram.com/xeption_corp/",
            "https://www.tiktok.com/@xeption237"
          ]
        },
        {
          "@type": "ElectronicsStore",
          "parentOrganization": {
              "@id": "https://www.xeptionetwork.shop/#organization"
          },
          "name": "Xeption",
          "description": "Leader de la vente et du troc de produits High-Tech (Smartphones, PC, Consoles) au Cameroun.",
          "image": "https://res.cloudinary.com/dli0kdkg9/image/upload/v1768287078/logo_mbajfa.png",
          "@id": "https://www.xeptionetwork.shop",
          "url": "https://www.xeptionetwork.shop",
          "telephone": "+237641891031",
          "priceRange": "$$",
          "areaServed": ["Yaoundé", "Douala", "Cameroun"],
          "paymentAccepted": ["Cash", "Orange Money", "MTN Mobile Money"],
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Boutique 2063, Mfoundi Mall",
            "addressLocality": "Yaoundé",
            "addressRegion": "Centre",
            "postalCode": "00237",
            "addressCountry": "CM"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 3.8480,
            "longitude": 11.5021
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
              "opens": "09:00",
              "closes": "20:00"
            }
          ]
        }
      ]
    }
    </script>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Pinyon+Script&display=swap"
    rel="stylesheet">

  <!-- Tailwind CDN kept for visual consistency with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            xeption: {
              gold: '#FFD700',      /* Gold vibrant */
              goldDim: '#B8860B',   /* Gold sombre */
              red: '#FF0033',       /* Rouge néon plus vif */
              black: '#050505',     /* Noir profond */
              dark: '#0F0F0F',      /* Gris très sombre */
              surface: '#18181B',   /* Surface carte */
              highlight: '#27272A'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            tech: ['Rajdhani', 'sans-serif'],
            pinyon: ['Pinyon Script', 'cursive'], /* Police Signature */
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'tech-grid': 'linear-gradient(to right, #1f1f1f 1px, transparent 1px), linear-gradient(to bottom, #1f1f1f 1px, transparent 1px)',
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
          }
        }
      }
    }
  </script>
  <style>
    html {
      background: #111;
      overflow-y: scroll;
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      background-color: transparent;
      color: #f3f4f6;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      /* Prevent horizontal scroll */
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FFD700;
    }

    /* Shimmer cards produit (chargement image) */
    @keyframes productImageShimmer {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .product-image-shimmer {
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 215, 0, 0.08) 45%,
        rgba(255, 255, 255, 0.12) 50%,
        rgba(255, 215, 0, 0.08) 55%,
        transparent 100%
      );
      animation: productImageShimmer 1.35s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .product-image-shimmer {
        animation: none;
        opacity: 0.35;
      }
    }

  /* Zoom lent sur fonds clairs (pages institutionnelles) */
    @keyframes siteLightBgZoomIn {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.1);
      }
    }

    .site-light-bg-zoom {
      transform-origin: center center;
      will-change: transform;
      animation: siteLightBgZoomIn var(--site-light-bg-zoom-duration, 75s) ease-out forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-light-bg-zoom {
        animation: none;
      }
    }

    .glass-panel {
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .neon-border {
      box-shadow: 0 0 5px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255, 215, 0, 0.05);
    }

    .tech-pattern {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    .shop-price-range {
      height: 1.5rem;
      margin: 0;
    }

    .shop-price-range::-webkit-slider-runnable-track {
      height: 0;
      background: transparent;
    }

    .shop-price-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      pointer-events: auto;
      width: 14px;
      height: 18px;
      margin-top: -8px;
      border-radius: 2px;
      background: #ffd700;
      border: 2px solid #0a0a0a;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.35);
      cursor: grab;
    }

    .shop-price-range::-moz-range-track {
      height: 0;
      background: transparent;
    }

    .shop-price-range::-moz-range-thumb {
      pointer-events: auto;
      width: 14px;
      height: 18px;
      border-radius: 2px;
      background: #ffd700;
      border: 2px solid #0a0a0a;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.35);
      cursor: grab;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
