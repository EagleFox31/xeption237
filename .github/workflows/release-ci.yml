name: Paid release CI

on:
  push:
    branches:
      - release/xeption-paid
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build application
        run: npx vite build

      - name: Generate sitemap
        run: node scripts/generateSitemap.js

      - name: Prerender SEO routes
        run: node scripts/prerender.mjs
