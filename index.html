<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505">

  <!-- Performance Optimization -->
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="NWUvZVr4uUF0RRFyxZlKZJaMfC8t3qLk_UvLfJtBfIU" />

  <!-- SEO & Categorization -->
  <title>Xeption | Leader High-Tech & Troc au Cameroun</title>

  <meta name="author" content="Xeption" />
  <meta name="robots" content="index, follow" />

  <!--
    SEO par page (description, canonical, Open Graph, Twitter) = géré dynamiquement
    par utils/seo.tsx (react-helmet-async) et capturé au prerender (scripts/prerender.mjs).
    NE PAS remettre ici de balises description / canonical / og:* / twitter:* statiques :
    Helmet AJOUTE les siennes sans supprimer celles-ci → doublons sur les pages prerendues.
    Conséquences observées : canonical produit + canonical accueil (risque de non-indexation),
    et aperçu de partage affichant le LOGO au lieu de la photo produit (1re balise gagne).
    Seul twitter:site reste ici (non géré par Helmet).
  -->
  <meta property="twitter:site" content="@xeption237" />

  <!-- Favicon - Correction complète pour Google (48px multiples) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="shortcut icon" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Structured Data (JSON-LD) - Double déclaration Store + Organization pour le Logo -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.xeptionetwork.shop/#organization",
          "name": "Xeption Network",
          "url": "https://www.xeptionetwork.shop",
          "logo": {
            "@type": "ImageObject",
            "url": "https://res.cloudinary.com/dli0kdkg9/image/upload/v1768287078/logo_mbajfa.png",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://www.facebook.com/xeptioon/",
            "https://www.instagram.com/xeption_corp/",
            "https://www.tiktok.com/@xeption237"
          ]
        },
        {
          "@type": "ElectronicsStore",
          "parentOrganization": {
              "@id": "https://www.xeptionetwork.shop/#organization"
          },
          "name": "Xeption",
          "description": "Leader de la vente et du troc de produits High-Tech (Smartphones, PC, Consoles) au Cameroun.",
          "image": "https://res.cloudinary.com/dli0kdkg9/image/upload/v1768287078/logo_mbajfa.png",
          "@id": "https://www.xeptionetwork.shop",
          "url": "https://www.xeptionetwork.shop",
          "telephone": "+237641891031",
          "priceRange": "$$",
          "areaServed": ["Yaoundé", "Douala", "Cameroun"],
          "paymentAccepted": ["Cash", "Orange Money", "MTN Mobile Money"],
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Boutique 2063, Mfoundi Mall",
            "addressLocality": "Yaoundé",
            "addressRegion": "Centre",
            "postalCode": "00237",
            "addressCountry": "CM"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 3.8480,
            "longitude": 11.5021
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
              "opens": "09:00",
              "closes": "20:00"
            }
          ]
        }
      ]
    }
    </script>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Pinyon+Script&display=swap"
    rel="stylesheet">

  <!-- Tailwind CDN kept for visual consistency with custom config -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
