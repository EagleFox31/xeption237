<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquette Mobile — Verdict avec Bonus Fixe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }
    .mobile-frame {
      width: 390px;
      height: 844px;
      background: #0a0a0c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
    }
    /* Status bar */
    .status-bar {
      height: 44px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      font-size: 12px;
    }
    /* Header */
    .header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .header-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }
    .certif-badge {
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 999px;
      color: #34d399;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* Content */
    .content {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
    }
    /* Device chip */
    .device-chip {
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .device-icon {
      font-size: 20px;
    }
    .device-info {
      text-align: left;
    }
    .device-name {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .device-grade {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 600;
    }
    /* Hero price section */
    .hero-price-section {
      margin: 20px 0;
    }
    .price-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9ca3af;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .hero-price {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fbbf24 0%, #d4af37 50%, #fef08a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
      margin-bottom: 12px;
    }
    .bonus-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #fef08a;
      letter-spacing: 0.3px;
    }
    /* Buttons action zone */
    .action-zone {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-exchange {
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #fbbf24 0%, #d4af37 60%, #eab308 100%);
      border: none;
      border-radius: 20px;
      color: #000;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.45);
      transition: transform 0.2s;
    }
    .btn-exchange-title {
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-exchange-sub {
      font-size: 12px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.8);
    }
    .btn-cash {
      width: 100%;
      padding: 16px 20px;
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.2s;
    }
    .btn-cash-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f3f4f6;
    }
    .btn-cash-sub {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
    }
    /* Trust footer */
    .trust-footer {
      font-size: 11px;
      color: #6b7280;
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: 0.2px;
    }
    /* Bottom nav */
    .bottom-nav {
      height: 72px;
      background: #000;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      position: relative;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #6b7280;
      font-size: 10px;
      font-weight: 600;
    }
    .nav-troc-btn {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #d4af37);
      border: 4px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.5);
    }
    .nav-troc-btn span {
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <!-- Status bar -->
    <div class="status-bar">
      <span>09:41</span>
      <div class="status-icons">●●● 5G 100%</div>
    </div>

    <!-- Header -->
    <div class="header">
      <div class="back-btn">‹</div>
      <div class="header-title">Smart Troc</div>
      <div class="certif-badge">✓ Vérifié IA</div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Device Chip -->
      <div class="device-chip">
        <div class="device-icon">📱</div>
        <div class="device-info">
          <div class="device-name">iPhone 13 Pro 128 Go</div>
          <div class="device-grade">Grade A · Bon état certifié</div>
        </div>
      </div>

      <!-- Hero Price -->
      <div class="hero-price-section">
        <div class="price-label">Valeur de reprise proposée</div>
        <div class="hero-price">300 000 F</div>
        <div class="bonus-pill">
          <span>🎁</span>
          <span>+20 000 F de bonus échange inclus</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-zone">
        <!-- Button 1 : Échanger -->
        <button class="btn-exchange">
          <div class="btn-exchange-title">
            <span>🔄</span>
            <span>Échanger votre téléphone : 300 000 F</span>
          </div>
          <div class="btn-exchange-sub">
            +20 000 F offerts pour votre nouvel appareil
          </div>
        </button>

        <!-- Button 2 : Vendre -->
        <button class="btn-cash">
          <div class="btn-cash-title">
            <span>💵</span>
            <span>Nous vendre votre téléphone : 280 000 F</span>
          </div>
          <div class="btn-cash-sub">
            Paiement cash direct en boutique ou MoMo
          </div>
        </button>
      </div>

      <!-- Trust Note -->
      <div class="trust-footer">
        Offre valable 7 jours · Retrait boutique Mfoundi Mall, Yaoundé
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item">🏠<span>Accueil</span></div>
      <div class="nav-item">🗂️<span>Catégories</span></div>
      <div class="nav-troc-btn">
        📷
        <span>Troc</span>
      </div>
      <div class="nav-item">🏷️<span>Promos</span></div>
      <div class="nav-item">👤<span>Compte</span></div>
    </div>
  </div>
</body>
</html>
